name: Arch Linux package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rust python lua webkit2gtk-4.1 gtk3 libayatana-appindicator openssl dbus libxcb libx11 libxrandr xdotool xclip tesseract tesseract-data-eng tesseract-data-chi_sim desktop-file-utils gtk4 libadwaita gtk4-layer-shell libepoxy fontconfig
      - uses: actions/checkout@v4
      - name: Verify Omarchy click dismissal
        run: lua tests/omarchy.test.lua
      - name: Build and package as an unprivileged user
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd "$1" && npm ci --ignore-scripts && npm run build:arch' -- "$GITHUB_WORKSPACE"
      - name: Verify package installation and dependencies
        run: |
          # The minimal Arch image excludes documentation. Install the full payload
          # here so pacman can verify every file declared by our package.
          sed -i '/^NoExtract[[:space:]]*=/d' /etc/pacman.conf
          pacman -U --noconfirm dist/arch/*.pkg.tar.zst
          pacman -Qkk lucas-translate
          desktop-file-validate /usr/share/applications/lucas-translate.desktop
          ldd /usr/bin/lucas-translate | tee /tmp/lucas-translate-ldd.txt
          ! grep -q 'not found' /tmp/lucas-translate-ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          if-no-files-found: error
          retention-days: 14
          path: dist/arch/*.pkg.tar.zst
