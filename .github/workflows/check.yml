name: Regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxcb1-dev libxrandr-dev
      - name: Core regression tests (no provider requests)
        run: cargo test --manifest-path crates/lucas-core/Cargo.toml --locked -- --skip network
      - name: Full desktop build, including platform and IPC integration
        run: cargo build --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Desktop regression tests (no real clipboard or TCC changes)
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
