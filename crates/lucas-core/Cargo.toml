[package]
name = "lucas-core"
version = "0.1.0"
edition = "2021"
description = "Core library for lucas-translate: translation/dictionary/OCR services, phonetics & pinyin"
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.10"
md-5 = "0.10"
whatlang = "0.16"
url = "2"
httpdate = "1"
