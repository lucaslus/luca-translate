[package]
name = "lucas-core"
version = "0.1.0"
edition = "2021"
description = "Core library for lucas-translate: translation/dictionary/OCR services, phonetics & pinyin"
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.10"
md-5 = "0.10"
whatlang = "0.16"
url = "2"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "io-util"] }
tokio-util = "0.7"
