[package]
name = "lucas-translate-omarchy-backend"
version = "0.1.0"
edition = "2021"
description = "Headless translation service for the native Omarchy Shell plugin"
license = "MIT"

[dependencies]
lucas-core = { path = "../lucas-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "signal"] }
tokio-util = "0.7"
