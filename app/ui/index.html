<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucas Translate</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="state.css" />
</head>
<body>
  <div id="app">
    <!-- 标题栏：可拖拽；上下文标签显示唤起方式 -->
    <header class="titlebar">
      <div class="spacer"></div>
      <button class="ghost pin-toggle" id="btn-pin" type="button" title="置顶窗口" aria-label="置顶窗口" aria-pressed="false" disabled>
        <svg class="pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 17v5" />
          <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
        </svg>
      </button>
      <button class="ghost" id="btn-settings" title="偏好设置"><span class="icon">settings</span></button>
    </header>

    <!-- 输入区 -->
    <textarea id="input" rows="4" maxlength="20000" aria-label="待翻译文本" placeholder="输入文本，Enter 翻译，Shift+Enter 换行" autofocus></textarea>

    <!-- 语言栏 -->
    <div class="langbar">
      <div class="lang-selectors">
        <select id="from-lang" title="源语言">
          <option value="auto">自动检测</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
        </select>
        <button class="swap" id="swap" title="交换语言"><span class="icon">swap_horiz</span></button>
        <select id="to-lang" title="目标语言">
          <option value="auto" selected>规则匹配</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
        </select>
        <button type="button" class="info-tip" id="auto-rule-info" aria-label="查看自动翻译规则">
          <span class="icon">info</span>
          <span class="tooltip">规则匹配：按检测到的源语言自动选择目标语言。在偏好设置 → 通用 → 规则匹配 中修改，点击前往</span>
        </button>
      </div>
      <div class="lang-actions">
        <button class="chip-btn" id="svc-btn" title="翻译服务开关" aria-expanded="false" aria-controls="svc-pop"><span class="icon">tune</span>服务</button>
      </div>
      <div class="svc-pop" id="svc-pop" hidden></div>
    </div>

    <div class="detect-note" id="detect-info" role="status"></div>

    <!-- 结果区 -->
    <main id="result">
      <div class="state-slot state-inline state-standalone" data-state="idle">
        <span class="state-art" aria-hidden="true"><span class="icon">translate</span></span>
        <div class="state-content">
          <p class="state-title">输入或划词开始翻译</p>
          <p class="state-description">输入文字，按 Enter 翻译</p>
        </div>
      </div>
    </main>
    <div id="result-status" class="state-sr-only" role="status" aria-live="polite"></div>

    <!-- 底栏 -->
    <footer class="statusbar">
      <span id="work-indicator" hidden></span>
      <span class="meta" id="service-tag"></span>
      <span class="meta error" id="error-tag"></span>
      <button class="btn" id="cancel-work" hidden>取消</button>
      <div class="spacer"></div>
      <button class="ghost" id="btn-history" title="历史记录"><span class="icon">schedule</span></button>
      <button class="ghost" id="btn-favorites" title="收藏夹"><span class="icon">star</span></button>
    </footer>

    <!-- 历史/收藏面板 -->
    <div id="panel" class="hidden" role="dialog" aria-modal="true" aria-label="历史记录与收藏">
      <div class="panel-head">
        <div class="panel-tabs" role="tablist" aria-label="记录类型">
          <button class="tab active" data-tab="history" role="tab" aria-selected="true">历史</button>
          <button class="tab" data-tab="favorites" role="tab" aria-selected="false">收藏</button>
        </div>
        <div class="panel-actions">
          <button class="ghost" id="panel-clear" title="清空历史"><span class="icon">delete</span></button>
          <button class="ghost" id="panel-close" title="关闭 (Esc)"><span class="icon">close</span></button>
        </div>
      </div>
      <div id="panel-list"></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="preferences.js"></script>
  <script src="state.js"></script>
  <script src="errors.js"></script>
  <script src="main.js"></script>
</body>
</html>
