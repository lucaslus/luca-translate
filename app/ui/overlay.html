<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }
    /* 半透明遮罩层，选区内部透出屏幕 */
    #mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.22);
    }
    /* 选区框 */
    #selection {
      position: fixed;
      display: none;
      border: 1.5px solid #e8833a;
      background: transparent;
      box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.22);
      pointer-events: none;
    }
    #selection .size-label {
      position: absolute;
      top: -26px;
      left: 0;
      background: rgba(20, 20, 22, 0.85);
      color: #fff;
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }
    #tip {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 22, 0.78);
      backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.92);
      font-size: 12.5px;
      font-family: -apple-system, "PingFang SC", sans-serif;
      padding: 7px 18px;
      border-radius: 999px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="mask"></div>
  <div id="selection"><span class="size-label"></span></div>
  <div id="tip">拖拽框选识别区域，Esc 取消</div>
  <script src="overlay.js"></script>
</body>
</html>
