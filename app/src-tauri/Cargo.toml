[package]
name = "lucas-translate"
version = "0.1.0"
edition = "2021"
description = "Cross-platform translate & OCR tool with built-in phonetics and pinyin"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lucas-core = { path = "../../crates/lucas-core" }
arboard = "3"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
md-5 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# 0.24 declares screen-capture C bool returns as boolean_t, causing false
# permission denials on Intel Macs (servo/core-foundation-rs#698).
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
image = "0.25"
screenshots = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Ole", "Win32_System_Com", "Win32_System_DataExchange", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation"] }
