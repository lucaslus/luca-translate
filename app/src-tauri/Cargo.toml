[package]
name = "lucas-translate"
version = "0.1.0"
edition = "2021"
description = "Cross-platform translate & OCR tool with built-in phonetics and pinyin"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lucas-core = { path = "../../crates/lucas-core" }
arboard = "3"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
md-5 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
image = "0.25"
screenshots = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation"] }
